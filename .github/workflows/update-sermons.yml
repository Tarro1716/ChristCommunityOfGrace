name: Update sermons from YouTube

# Runs every Monday 06:00 Manila time (Sunday 22:00 UTC) and on demand.
# Reads the channel's public feed, rebuilds the site, and commits if anything changed.
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest sermons
        run: node tools/fetch-sermons.js
        continue-on-error: true
      - name: Rebuild and test
        run: npm test
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Update sermons from YouTube feed"
          git push
